services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:${SERVER_INTERNAL_PORT:-8080}"
      # gradle debug port
      - "5005:5005"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    volumes:
      # Bind-mount project root into /app inside container. On macOS, use :delegated for perf.
      - ./:/app:delegated
      # Avoid mounting host build output into container to prevent file-lock and delete failures.
      # Use a named volume for build outputs if persistence across restarts is desired.
      - build-cache:/app/build:delegated
      # Bind-mount host Gradle cache to the path used inside the image (/home/gradle/.gradle)
      - ~/.gradle:/home/gradle/.gradle:delegated
    # --debug-jvm 대신 suspend=n 옵션이 들어간 JVM 아규먼트 전달
    command: [ "./gradlew", "bootRun", "--no-daemon", "-PjvmArgs=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005" ]

  mysql:
    image: '${MYSQL_IMAGE:-mysql:8.4}'
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-maeul}
      MYSQL_USER: ${MYSQL_USER:-maeul}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-maeul}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: ${TZ:-Asia/Seoul}
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}"']
      interval: ${MYSQL_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${MYSQL_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${MYSQL_HEALTHCHECK_RETRIES:-10}
      start_period: ${MYSQL_HEALTHCHECK_START_PERIOD:-20s}
    ports:
      - '${MYSQL_PORT:-3306}:${MYSQL_INTERNAL_PORT:-3306}'
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: '${REDIS_IMAGE:-redis:7.4-alpine}'
    environment:
      TZ: ${TZ:-Asia/Seoul}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: ${REDIS_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${REDIS_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${REDIS_HEALTHCHECK_RETRIES:-10}
    ports:
      - '${REDIS_PORT:-6379}:${REDIS_INTERNAL_PORT:-6379}'

  flyway:
    image: flyway/flyway:9
    env_file:
      - .env
    # Run migrations against local mysql; reads SQL from project resources
    command:
      - "-url=jdbc:mysql://${FLYWAY_MYSQL_HOST:-mysql}:${MYSQL_INTERNAL_PORT:-3306}/${MYSQL_DATABASE:-maeul}?useSSL=${MYSQL_USE_SSL:-false}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:-true}"
      - "-user=${MYSQL_USER:-maeul}"
      - "-password=${MYSQL_PASSWORD:-maeul}"
      - "-cleanDisabled=false"
      - "clean"
      - "migrate"
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  mysql-data:
  grafana-data:
  build-cache: