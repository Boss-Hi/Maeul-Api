services:
  app:
    build: .
    env_file:
      - .env
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_INTERNAL_PORT:-8080}"
    # DB 및 Redis가 완전 준비된 후 app 실행
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        # build.gradle 변경 시 컨테이너 재빌드
        - action: rebuild
          path: ./build.gradle

        # bootRun 실행 환경에서는 target을 /app/build로 단순화
        - action: sync
          path: ./build/classes/java/main
          target: /app/build/classes/java/main
        - action: sync
          path: ./build/resources/main
          target: /app/build/resources/main
        # HTML/정적 파일 수정 시 즉시 빌드 디렉터리로 복사하고 싶다면 추가
        - action: sync
          path: ./src/main/resources/static
          target: /app/build/resources/main/static
  mysql:
    image: '${MYSQL_IMAGE:-mysql:8.4}'
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-maeul}
      MYSQL_USER: ${MYSQL_USER:-maeul}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-maeul}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: ${TZ:-Asia/Seoul}
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}"']
      interval: ${MYSQL_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${MYSQL_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${MYSQL_HEALTHCHECK_RETRIES:-10}
      start_period: ${MYSQL_HEALTHCHECK_START_PERIOD:-20s}
    ports:
      - '${MYSQL_PORT:-3306}:${MYSQL_INTERNAL_PORT:-3306}'
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: '${REDIS_IMAGE:-redis:7.4-alpine}'
    environment:
      TZ: ${TZ:-Asia/Seoul}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: ${REDIS_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${REDIS_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${REDIS_HEALTHCHECK_RETRIES:-10}
    ports:
      - '${REDIS_PORT:-6379}:${REDIS_INTERNAL_PORT:-6379}'

  # Prometheus 컨테이너
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - app

  # Grafana 컨테이너
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # 초기 비밀번호 설정
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana

# 볼륨 구조 간소화
volumes:
  mysql-data:
  grafana-data: # Grafana 대시보드 설정 저장용 볼륨