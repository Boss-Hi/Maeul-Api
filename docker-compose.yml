services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:${SERVER_INTERNAL_PORT:-8080}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        # 1. 이미지/Gradle 실행 환경 변경 시 컨테이너 재빌드
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./build.gradle
        - action: rebuild
          path: ./settings.gradle
        - action: rebuild
          path: ./gradlew
        - action: rebuild
          path: ./gradle

        # 2. Java 코드 및 리소스 수정 시 /app/src 로 sync 후 컨테이너 재시작
        # bootRun 은 /app/build/classes 를 기준으로 실행되므로 source sync 만으로는 반영되지 않는다.
        - action: sync+restart
          path: ./src
          target: /app/src

  mysql:
    image: '${MYSQL_IMAGE:-mysql:8.4}'
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-maeul}
      MYSQL_USER: ${MYSQL_USER:-maeul}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-maeul}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: ${TZ:-Asia/Seoul}
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}"']
      interval: ${MYSQL_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${MYSQL_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${MYSQL_HEALTHCHECK_RETRIES:-10}
      start_period: ${MYSQL_HEALTHCHECK_START_PERIOD:-20s}
    ports:
      - '${MYSQL_PORT:-3306}:${MYSQL_INTERNAL_PORT:-3306}'
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: '${REDIS_IMAGE:-redis:7.4-alpine}'
    environment:
      TZ: ${TZ:-Asia/Seoul}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: ${REDIS_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${REDIS_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${REDIS_HEALTHCHECK_RETRIES:-10}
    ports:
      - '${REDIS_PORT:-6379}:${REDIS_INTERNAL_PORT:-6379}'

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  mysql-data:
  grafana-data: