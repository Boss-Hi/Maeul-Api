services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file:
      - .env
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:${SERVER_INTERNAL_PORT:-8080}"
    depends_on:
      redis:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    restart: always
    extra_hosts:
      # host.docker.internal 이 호스트 OS(Ubuntu)를 가리키도록 설정
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Actuator의 health 엔드포인트 확인 (Actuator 사용 중인 경우)
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s # Spring Boot가 켜지는 동안 기다려주는 시간

  redis:
    image: '${REDIS_IMAGE:-redis:7.4-alpine}'
    environment:
      TZ: ${TZ:-Asia/Seoul}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: ${REDIS_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${REDIS_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${REDIS_HEALTHCHECK_RETRIES:-10}
    ports:
      - '${REDIS_PORT:-6379}:${REDIS_INTERNAL_PORT:-6379}'
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - app
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
    restart: always

  flyway:
    image: flyway/flyway:9
    env_file:
      - .env
    # Run migrations against local mysql; reads SQL from project resources
    command:
      - "-url=jdbc:mysql://${FLYWAY_MYSQL_HOST:-mysql}:${MYSQL_INTERNAL_PORT:-3306}/${MYSQL_DATABASE:-maeul}?useSSL=${MYSQL_USE_SSL:-false}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:-true}"
      - "-user=${MYSQL_USER:-maeul}"
      - "-password=${MYSQL_PASSWORD:-maeul}"
      - "-cleanDisabled=false"
      - "clean"
      - "migrate"
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  grafana-data: