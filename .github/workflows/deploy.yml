name: Java CI/CD with Gradle

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          java-version: '26'
          distribution: 'temurin'

      # 1. GitHub Actions 환경에서 JAR 빌드
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 2. 빌드된 JAR 파일 및 Docker 관련 설정 파일 서버로 전송
      - name: Transfer JAR and Docker Config via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          # JAR 파일, docker-compose.prod.yml, Dockerfile 모두 전송
          source: "build/libs/*.jar, docker-compose.prod.yml, Dockerfile"
          target: ${{secrets.PROJECT_PATH}}/
          strip_components: 0 # 파일들이 프로젝트 루트 및 지정된 구조대로 들어가도록 유지하거나 상황에 맞게 조정

      # 3. 전송된 파일들을 기반으로 운영 서버에서 Docker 컨테이너 재시작
      - name: Deploy Docker Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ${{secrets.PROJECT_PATH}}
            docker compose -f docker-compose.prod.yml up -d --build app
            docker image prune -f || true