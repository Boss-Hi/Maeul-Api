name: Automatic GitHub Release

on:
  push:
    tags:
      - 'v*.*.*' # v0.1.1, v1.0.0 같은 태그 푸시 시 실행

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release 생성을 위한 권한 설정

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. CHANGELOG.md에서 해당 태그 버전(예: v0.1.1)의 내용만 추출
      - name: Extract Release Notes from CHANGELOG
        id: extract_changelog
        uses: charlie-haley/extract-changelog-action@v1
        with:
          changelog_path: 'CHANGELOG.md'
          version: ${{ github.ref_name }}

      # 2. Java 26 환경 세팅 및 빌드 (JAR 파일 첨부용)
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      # 3. 추출한 CHANGELOG 내용으로 Release 자동 생성 + JAR 파일 첨부
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: ${{ steps.extract_changelog.outputs.release_notes }}
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}