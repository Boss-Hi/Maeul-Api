name: Automatic GitHub Release

on:
  push:
    tags:
      - 'v*.*.*' # v0.1.1, v1.0.0 같은 태그 푸시 시 실행

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release 생성을 위한 권한 설정

    steps:
      # 1. 저장소 체크아웃 (name과 uses를 들여쓰기로 올바르게 연결)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 공식 actions/github-script를 사용하여 CHANGELOG.md에서 현재 태그 버전 내용만 안전하게 추출
      - name: Extract Release Notes from CHANGELOG
        id: extract_changelog
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tagName = context.ref.replace('refs/tags/', '');
            const content = fs.readFileSync('CHANGELOG.md', 'utf8');
            
            // 현재 태그 버전(예: v0.1.1) 헤더부터 다음 버전 헤더 전까지의 내용 추출
            const escapedTag = tagName.replace(/[.*+?^\${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`##\\s+\\[?${escapedTag}\\]?[^\\n]*\\n([\\s\\S]*?)(?=\\n##\\s+\\[?v|$)`, 'i');
            const match = content.match(regex);
            
            const releaseNotes = match ? match[1].trim() : `Release notes for ${tagName}`;
            core.setOutput('release_notes', releaseNotes);

      # 3. Java 26 환경 세팅 및 빌드 (JAR 파일 첨부용)
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      # 4. 추출한 CHANGELOG 내용으로 Release 자동 생성 + JAR 파일 첨부
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.extract_changelog.outputs.release_notes }}
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}