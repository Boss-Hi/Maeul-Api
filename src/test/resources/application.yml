spring:
  config:
    import: optional:file:.env[.properties]
  docker:
    compose:
      enabled: false
  datasource:
    url: ${TEST_SPRING_DATASOURCE_URL:jdbc:h2:mem:maeul-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${TEST_SPRING_DATASOURCE_USERNAME:sa}
    password: ${TEST_SPRING_DATASOURCE_PASSWORD:}
  data:
    redis:
      host: ${TEST_SPRING_DATA_REDIS_HOST:localhost}
      port: ${TEST_SPRING_DATA_REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET_KEY:secret-key}
  expiration: ${JWT_EXPIRATION:3600000}

open-api:
  korea-tourism:
    key: ${OPENAPI_KOREA_TOURISM_KEY:}
    base-url: ${OPENAPI_KOREA_TOURISM_BASE_URL:https://apis.data.go.kr/B551011}
    timeout-seconds: ${OPENAPI_KOREA_TOURISM_TIMEOUT_SECONDS:5}
    retry-count: ${OPENAPI_KOREA_TOURISM_RETRY_COUNT:1}
  base-url: ${OPEN_API_BASE_URL:https://apis.data.go.kr}
  service-key: ${OPEN_API_SECRET_KEY:}
  mobile-os: ${OPEN_API_MOBILE_OS:ETC}
  mobile-app: ${OPEN_API_MOBILE_APP:Maeul}
  response-type: ${OPEN_API_RESPONSE_TYPE:json}

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:30}
