<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Kakao Login Test</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .btn-kakao {
            display: inline-block;
            background-color: #FEE500;
            color: #000000;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
        }
        .btn-kakao:hover {
            background-color: #E6CE00;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Spring Boot Kakao Login Test</h2>
    <p>아래 버튼을 눌러 카카오 소셜 로그인을 진행하세요.</p>

    <!-- Spring Security OAuth2 기본 엔드포인트 -->
    <a class="btn-kakao" href="/oauth2/authorization/kakao">
        카카오계정으로 로그인
    </a>
</div>

</body>
</html>
