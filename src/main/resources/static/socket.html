<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Maeul Kafka & WebSocket Test</title>
    <!-- SockJS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <!-- 구형 Stomp.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .box { border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; border-radius: 5px; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 4px; max-height: 300px; overflow-y: auto; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        input[type="text"] { width: 400px; padding: 5px; }
    </style>
</head>
<body>

<h1>Maeul 실시간 일정 생성 테스트</h1>

<!-- 1. 연결 상태 표시 -->
<div class="box">
    <h3>1. WebSocket 연결 상태 및 인증</h3>
    <p id="connection-status" style="color: red; font-weight: bold;">연결 안 됨</p>
    <label>서버 주소: <input id="serverAddress" type="text" value="http://localhost:8080"></label><br><br>
    <label>JWT 토큰 (Authorization): <input id="authorization" placeholder="eyJhbGciOiJIUzI1NiIs..." type="text"></label><br><br>
    <label>구독할 사용자 ID (User ID): <input id="userId" type="number" value="1"></label><br><br>
    <button onclick="connectWebSocket()">웹소켓 연결하기</button>
</div>

<!-- 2. 일정 생성 요청 폼 -->
<div class="box">
    <h3>2. 일정 생성 요청 (REST API)</h3>
    <label>시작일: <input id="startDate" type="text" value="20261021"></label><br><br>
    <label>종료일: <input id="endDate" type="text" value="20261025"></label><br><br>
    <label>관광지 ID (Tour ID): <input id="tourId" type="text" value="3497502"></label><br><br>
    <button onclick="requestGenerateItinerary()">일정 생성 요청 보내기</button>
</div>

<!-- 3. 실시간 수신 결과 영역 -->
<div class="box">
    <h3>3. 실시간 수신 결과 (STOMP 메시지)</h3>
    <pre id="result-log">대기 중...</pre>
</div>

<script>
    let stompClient = null;

    function connectWebSocket() {
        const serverAddress = document.getElementById('serverAddress').value;
        const socket = new SockJS(serverAddress + '/ws-stomp');
        stompClient = Stomp.over(socket);

        const rawToken = document.getElementById('authorization').value.trim();
        if (!rawToken) {
            alert('JWT 토큰을 입력해주세요.');
            return;
        }
        const token = rawToken.startsWith("Bearer ") ? rawToken : "Bearer " + rawToken;

        const headers = {
            'Authorization': token
        };

        stompClient.connect(headers, function (frame) {
            // 성공 시
            document.getElementById('connection-status').innerText = '연결됨 (Connected)';
            document.getElementById('connection-status').style.color = 'green';
            console.log('Connected: ' + frame);

            stompClient.subscribe('/private/queue/itinerary-generate', function (message) {
                const data = JSON.parse(message.body);
                console.log('/private/queue/itinerary-generate 실시간 데이터 수신:', data);
                document.getElementById('result-log').innerText = '[수신 완료]\n' + JSON.stringify(data, null, 2);
            });
        }, function (error) {
            // ★ 실패 시 서버가 보낸 에러 문구를 화면에 출력
            console.error('STOMP 연결 오류:', error);

            let errorMessage = "인증 실패 또는 연결 거부";
            if (typeof error === 'string') {
                errorMessage = error;
            } else if (error.headers && error.headers.message) {
                errorMessage = error.headers.message;
            } else if (error.body) {
                errorMessage = error.body;
            }

            document.getElementById('connection-status').innerText = '연결 실패: ' + errorMessage;
            document.getElementById('connection-status').style.color = 'red';
            document.getElementById('result-log').innerText = '[인증 오류 발생]\n' + errorMessage;
        });
    }

    async function requestGenerateItinerary() {
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        const tourId = document.getElementById('tourId').value;
        const rawToken = document.getElementById('authorization').value.trim();

        if (!rawToken) {
            alert('JWT 토큰을 입력해주세요.');
            return;
        }
        const token = rawToken.startsWith("Bearer ") ? rawToken : "Bearer " + rawToken;

        const requestData = {
            startDate: startDate,
            endDate: endDate,
            tour_id: tourId
        };

        try {
            document.getElementById('result-log').innerText = '일정 생성 요청 전송 중... Kafka 대기 중...';

            const serverAddress = document.getElementById('serverAddress').value;
            const response = await fetch(serverAddress + '/api/itinerary/kafka/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': token
                },
                body: JSON.stringify(requestData)
            });

            if (!response.ok) {
                throw new Error('API 요청 실패 (상태 코드: ' + response.status + ')');
            }

            const result = await response.json();
            console.log('API 응답:', result);
        } catch (error) {
            console.error('요청 실패:', error);
            document.getElementById('result-log').innerText = 'API 요청 실패: ' + error.message;
        }
    }
</script>
</body>
</html>
