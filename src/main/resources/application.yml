spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: Maeul-Api
  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE # SQL 파라미터 출력
  web:
    resources:
      cache:
        period: ${SPRING_WEB_RESOURCES_CACHE_PERIOD:0} # 정적 자원 캐시 끌기
  docker:
    compose:
      enabled: false
      file: ./docker-compose.yml
      lifecycle-management: start-and-stop
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_INTERNAL_PORT:3306}/${MYSQL_DATABASE:maeul}?useSSL=${MYSQL_USE_SSL:false}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&serverTimezone=${TZ:Asia/Seoul}&createDatabaseIfNotExist=${MYSQL_CREATE_DATABASE_IF_NOT_EXIST:true}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true} # 기존 운영 DB에 처음 도입할 때 필요
    clean-disabled: ${SPRING_FLYWAY_CLEAN_DISABLED:true}
  data:
    web:
      pageable:
        page-serialization-mode: via-dto
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_INTERNAL_PORT}
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: ${SERVER_PORT:8080}
  oauth2:
    redirect-url: ${SPRING_OAUTH_REDIRECT_URL:http://localhost:8080/oauth/redirect}

jwt:
  secret: ${JWT_SECRET_KEY:secret-key}
  expiration: 3600000

open-api:
  korea-tourism:
    key: ${OPENAPI_KOREA_TOURISM_KEY:}
    base-url: ${OPENAPI_KOREA_TOURISM_BASE_URL:https://apis.data.go.kr/B551011}
    timeout-seconds: ${OPENAPI_KOREA_TOURISM_TIMEOUT_SECONDS:5}
    retry-count: ${OPENAPI_KOREA_TOURISM_RETRY_COUNT:1}
  base-url: ${OPEN_API_BASE_URL:https://apis.data.go.kr}
  service-key: ${OPEN_API_SECRET_KEY:}
  mobile-os: ${OPEN_API_MOBILE_OS:ETC}
  mobile-app: ${OPEN_API_MOBILE_APP:Maeul}
  response-type: ${OPEN_API_RESPONSE_TYPE:json}

ai:
  gemini:
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.6-flash}
    temperature: ${GEMINI_TEMPERATURE:0.5}
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:4096}
    batch-enabled: ${GEMINI_BATCH_ENABLED:false}
    batch-prompt: ${GEMINI_BATCH_PROMPT:Hello from Maeul batch.}
    batch-cron: "${GEMINI_BATCH_CRON:0 0/30 * * * *}"

kakao:
    rest-api:
        key: ${KAKAO_REST_API_KEY:}
        base-url: ${KAKAO_REST_API_BASE_URL:https://dapi.kakao.com}
        callback-url: ${KAKAO_REST_API_CALLBACK_URL:https://dapi.kakao.com}
        timeout-seconds: ${KAKAO_REST_API_TIMEOUT_SECONDS:5}
        retry-count: ${KAKAO_REST_API_RETRY_COUNT:1}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: ${spring.application.name:maeul-api} # 메트릭 태그 지정

kraftadmin:
  enabled: true
  base-path: /admin
  title: "KraftAdmin Dashboard"
  logo-url: "https://example.com/logo.png"

  theme:
    primary-color: "#3b82f6"
    dark-mode: true

  storage:
    upload-dir: "uploads/admin"
    public-url-prefix: "/admin/files"

  security:
    session-expiry-minutes: 120
    cookie-name: "KRAFTADMIN_SESSION"

    required-roles:
      - ROLE_ADMIN
      - ROLE_MANAGER
      - ROLE_USER

    protected-routes:
      "/api/users/**": [ "ROLE_ADMIN" ]
      "/api/settings/**": [ "ROLE_ADMIN" ]

  pagination:
    default-page-size: 20
    max-page-size: 100

  features:
    allow-delete: true
    show-timestamps: true
    read-only: false

  locale-config:
    default-language: "en"
    timezone: "UTC"

  telemetry-config:
    cloud-url: "http://localhost:8080"
    enabled: true