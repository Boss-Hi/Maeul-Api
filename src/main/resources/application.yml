spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: Maeul-Api
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:true}
      file: ./docker-compose.yml
      lifecycle-management: start-and-stop
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/maeul?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:maeul}
    password: ${SPRING_DATASOURCE_PASSWORD:maeul}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET_KEY:secret-key}
  expiration: 3600000

open-api:
  base-url: ${OPEN_API_BASE_URL:https://apis.data.go.kr}
  service-key: ${OPEN_API_SECRET_KEY:}
  mobile-os: ${OPEN_API_MOBILE_OS:ETC}
  mobile-app: ${OPEN_API_MOBILE_APP:Maeu}
  response-type: ${OPEN_API_RESPONSE_TYPE:json}