spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: Maeul-Api
  docker:
    compose:
      enabled: false
      file: ./docker-compose.yml
      lifecycle-management: start-and-stop
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_INTERNAL_PORT:3306}/${MYSQL_DATABASE:maeul}?useSSL=${MYSQL_USE_SSL:false}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&serverTimezone=${TZ:Asia/Seoul}&createDatabaseIfNotExist=${MYSQL_CREATE_DATABASE_IF_NOT_EXIST:true}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_INTERNAL_PORT}

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET_KEY:secret-key}
  expiration: 3600000

open-api:
  base-url: ${OPEN_API_BASE_URL:https://apis.data.go.kr}
  service-key: ${OPEN_API_SECRET_KEY:}
  mobile-os: ${OPEN_API_MOBILE_OS:ETC}
  mobile-app: ${OPEN_API_MOBILE_APP:Maeul}
  response-type: ${OPEN_API_RESPONSE_TYPE:json}z